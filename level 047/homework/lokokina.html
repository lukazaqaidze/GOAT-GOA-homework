<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Design</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

<main>
    <ul class="list">
        <li><span>1</span>List item</li>
        <li><span>2</span>List item</li>
        <li>
            <span>3</span>List item
            <ul class="sublist">
                <li><span>1</span>List sub item</li>
                <li><span>2</span>List sub item</li>
            </ul>
        </li>
    </ul>
</main>

</body>
</html>
